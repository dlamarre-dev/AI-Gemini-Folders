<!DOCTYPE html>
<!--
  whats-new.html — opened in a tab once, on update to a release that has something
  to say (background.js, reason === 'update' gated on WHATS_NEW_VERSION). Minor
  releases bump nothing here and open no tab.

  1.8.0 / 4.7.0 announce the side panel (#106): a way of opening the extension that
  nobody would find on their own, and a feature nobody knows about is a feature
  nobody uses. The 1.7.0 / 4.6.0 cards it replaced are in git history.

  Same shell, stylesheet and rules as welcome.html: shared by both extensions,
  every string from chrome.i18n, dark-only (welcome.css), and nothing here talks to
  the network or writes storage. The cards are features, not steps, so the numbered
  markers are switched off via .cards.
-->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>&nbsp;</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <div class="bg-field"></div>

  <main class="wrap">
    <div class="brand">
      <span class="brand-mark"><img src="icon.svg" alt=""></span>
      <span id="nTitle"></span>
      <!-- Read from the manifest, so it can never disagree with what is installed. -->
      <span class="version-chip" id="nVersion"></span>
    </div>
    <h1 class="h1" id="nHeading"></h1>

    <ul class="steps cards">
      <li class="step">
        <div class="step-text">
          <h2 class="step-title" id="nPanelTitle"></h2>
          <p class="step-body" id="nPanelBody"></p>
        </div>
        <!-- The same glyph as the popup's new button: a window with a docked
             strip, drawn from plain lines (no icon set, no attribution). -->
        <div class="step-art">
          <span class="glyph glyph-accent">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true" class="ico-panel">
              <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/>
            </svg>
          </span>
        </div>
      </li>
    </ul>

    <div class="cta-row">
      <button id="nCta" type="button" class="btn btn-primary"></button>
    </div>
  </main>

  <script src="whats-new.js"></script>
</body>
</html>
