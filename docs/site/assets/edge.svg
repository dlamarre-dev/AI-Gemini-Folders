<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Microsoft Edge">
  <title>Microsoft Edge</title>
  <defs>
    <linearGradient id="edgeBody" x1="14%" y1="82%" x2="88%" y2="18%">
      <stop offset="0%" stop-color="#0C7C8C"/>
      <stop offset="45%" stop-color="#1273C6"/>
      <stop offset="100%" stop-color="#2B5CE0"/>
    </linearGradient>
    <linearGradient id="edgeSwoosh" x1="8%" y1="18%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#41D6A0"/>
      <stop offset="52%" stop-color="#22B6C6"/>
      <stop offset="100%" stop-color="#1D8FD1"/>
    </linearGradient>
  </defs>

  <!-- Upper crescent: the blue body that sweeps from the lower left up and over. -->
  <path fill="url(#edgeBody)"
        d="M44.3 32.6C41 38.9 34.3 43 26.6 43c-9.4 0-16.6-5.7-16.6-13 0-3.4 1.9-6.4 4.9-8.1
           -1 1.6-1.5 3.3-1.5 5 0 5.6 5.4 9.5 13.2 9.5 4.9 0 10.5-1.2 17.7-3.8z"/>

  <!-- Lower-left swoosh: the teal-to-green arc that gives the mark its motion. -->
  <path fill="url(#edgeSwoosh)"
        d="M14.9 21.9C10.6 24.3 8 28.2 8 32.6c0 2.3.6 4.5 1.7 6.4C5.4 35.8 3 30.6 3 24.9
           3 13.4 12.9 5 24.6 5c6.1 0 11.5 2.3 15.2 6.2-3.1-1.9-6.8-2.9-10.8-2.9
           -6.6 0-12.3 3.2-14.1 8.6-.6 1.7-.6 3.4 0 5z"/>

  <!-- Top arc: closes the silhouette so the mark still reads at 16-20px. -->
  <path fill="url(#edgeBody)" opacity=".9"
        d="M39.8 11.2C36.5 7.4 31.4 5 24.6 5 12.9 5 3 13.4 3 24.9h11.9c0-1.3.2-2.5.6-3.6
           1.8-5.4 7.5-8.6 14.1-8.6 4 0 7.7 1 10.8 2.9z"/>
</svg>
